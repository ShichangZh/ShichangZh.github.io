# jemdoc configuration for shichangzh.github.io
# Used by compile_all_jemdoc.sh via:  jemdoc -c jemdoc.conf <file>.jemdoc
# Only the blocks below override jemdoc's defaults; everything else is inherited.
# NOTE for editors: a block ends at the first BLANK line, and any line starting
# with '#' is dropped as a comment. Keep each block unbroken and '#'-free.

[firstbit]
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="generator" content="jemdoc, see http://jemdoc.jaboc.net/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&amp;display=swap" />
<script>(function(){try{var t=localStorage.getItem("theme");if(t){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>

[menustart]
<a class="skip-link" href="#layout-content">Skip to main content</a>
<div id="tlayout">
<header id="layout-menu">
<nav class="menu-inner">

[menuend]
</nav>
</header>
<main id="layout-content">

[menulastbit]
</main>
</div>

[nomenu]
<div id="tlayout" class="no-menu">
<main id="layout-content">

[nomenulastbit]
</main>
</div>

[bodyend]
<script src="site.js"></script>
</body>
</html>
